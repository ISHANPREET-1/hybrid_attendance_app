name: hybrid_attendance_app
description: A hybrid attendance tracking app for students and teachers.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  fl_chart: ^0.68.0
  shared_preferences: ^2.3.2
  http: ^1.2.2
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  cookie_jar: ^4.0.9
  path_provider: ^2.1.6
  network_info_plus: 8.2.1  # 8.2.2 needs dbus 0.8, incompatible with geolocator_linux
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
